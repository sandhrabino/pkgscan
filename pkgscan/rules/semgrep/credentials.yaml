# Signal 5.3 - Credential Access Patterns
# Rule ids are prefixed cred-<type> so the correlator can count distinct credential types.
rules:
  - id: cred-ssh-keys
    languages: [regex]
    severity: ERROR
    message: References SSH private keys / authorized_keys
    metadata: {category: credential_access, signal: "5.3"}
    paths: {exclude: ["*.md", "*.markdown", "*.rst", "*.txt", "LICENSE*", "CHANGELOG*", "*.d.ts"]}
    pattern-regex: \.ssh(?:/|\\\\|["'],\s*["'])(?:id_rsa|id_ed25519|id_ecdsa|id_dsa|authorized_keys|known_hosts)

  - id: cred-cloud
    languages: [regex]
    severity: ERROR
    message: References cloud provider credential stores
    metadata: {category: credential_access, signal: "5.3"}
    paths: {exclude: ["*.md", "*.markdown", "*.rst", "*.txt", "LICENSE*", "CHANGELOG*", "*.d.ts"]}
    pattern-regex: (?:\.aws(?:/|\\\\|["'],\s*["'])credentials|\.config(?:/|\\\\|["'],\s*["'])gcloud|application_default_credentials\.json|\.azure(?:/|\\\\|["'],\s*["'])|\.kube(?:/|\\\\|["'],\s*["'])config|\.docker(?:/|\\\\|["'],\s*["'])config\.json)

  - id: cred-git
    languages: [regex]
    severity: WARNING
    message: References git credential stores
    metadata: {category: credential_access, signal: "5.3"}
    paths: {exclude: ["*.md", "*.markdown", "*.rst", "*.txt", "LICENSE*", "CHANGELOG*", "*.d.ts"]}
    pattern-regex: (?:\.git-credentials|["'/\\]\.netrc\b|gh\s+auth\s+token|\.config/gh/hosts\.yml)

  - id: cred-shell-history
    languages: [regex]
    severity: ERROR
    message: References shell history files
    metadata: {category: credential_access, signal: "5.3"}
    paths: {exclude: ["*.md", "*.markdown", "*.rst", "*.txt", "LICENSE*", "CHANGELOG*"]}
    pattern-regex: \.(?:bash|zsh|sh|python|node_repl|psql|mysql)_history\b

  - id: cred-registry-tokens
    languages: [regex]
    severity: INFO
    message: References package registry auth files (.npmrc/.pypirc) - legitimate alone
    metadata: {category: credential_access, signal: "5.3"}
    paths: {exclude: ["*.md", "*.markdown", "*.rst", "*.txt", "LICENSE*", "CHANGELOG*"]}
    pattern-regex: (?:["'/\\]\.npmrc\b|["'/\\]\.pypirc\b|_authToken|NPM_TOKEN|npm\s+whoami)

  - id: cred-browser-stores
    languages: [regex]
    severity: ERROR
    message: References browser credential/cookie databases
    metadata: {category: credential_access, signal: "5.3"}
    paths: {exclude: ["*.md", "*.markdown", "*.rst", "*.txt", "LICENSE*", "CHANGELOG*"]}
    pattern-regex: (?:Login Data|Web Data|cookies\.sqlite|logins\.json|key4\.db|key3\.db|Local State|Google[/\\\\]Chrome[/\\\\]User Data|BraveSoftware|Mozilla[/\\\\]Firefox[/\\\\]Profiles|Library/Cookies/Cookies\.binarycookies|Library/Keychains)

  - id: cred-system-files
    languages: [regex]
    severity: ERROR
    message: References system credential files (/etc/shadow, SAM)
    metadata: {category: credential_access, signal: "5.3"}
    paths: {exclude: ["*.md", "*.markdown", "*.rst", "*.txt", "LICENSE*", "CHANGELOG*"]}
    pattern-regex: (?:/etc/shadow|/etc/passwd|/etc/sudoers|config[/\\\\]+SAM\b|\\\\SAM\b|reg(?:\.exe)?\s+save\s+hklm\\\\sam)

  - id: cred-secret-scanner-tool
    languages: [regex]
    severity: ERROR
    message: Bundles/invokes a secret-scanning tool (Shai-Hulud style credential harvesting)
    metadata: {category: credential_access, signal: "5.3"}
    paths: {exclude: ["*.md", "*.markdown", "*.rst", "*.txt", "LICENSE*", "CHANGELOG*"]}
    pattern-regex: (?i)\b(?:trufflehog|gitleaks)\b\s+(?:filesystem|git|detect|github)

  - id: js-env-dump
    languages: [javascript, typescript]
    severity: ERROR
    message: Serialises or enumerates the whole environment (environment harvesting)
    metadata: {category: credential_access, signal: "5.3"}
    pattern-either:
      - pattern: JSON.stringify(process.env, ...)
      - pattern: Object.keys(process.env)
      - pattern: Object.entries(process.env)
      - pattern: Object.values(process.env)
      - pattern: 'JSON.stringify({..., env: process.env, ...}, ...)'

  - id: js-env-secret-read
    languages: [javascript, typescript]
    severity: WARNING
    message: Reads a secret-looking environment variable
    metadata: {category: credential_access, signal: "5.3"}
    patterns:
      - pattern-either:
          - pattern: process.env.$V
          - pattern: process.env["$V"]
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(token|secret|passw|apikey|api_key|private|aws_|npm_|github_|gh_|gcp|azure|credential|session).*

  - id: py-env-dump
    languages: [python]
    severity: ERROR
    message: Serialises or enumerates the whole environment (environment harvesting)
    pattern-either:
      - pattern: json.dumps(dict(os.environ), ...)
      - pattern: json.dumps(os.environ.copy(), ...)
      - pattern: str(os.environ)
      - pattern: dict(os.environ)
      - pattern: os.environ.items()
    metadata: {category: credential_access, signal: "5.3"}

  - id: py-env-secret-read
    languages: [python]
    severity: WARNING
    message: Reads a secret-looking environment variable
    metadata: {category: credential_access, signal: "5.3"}
    patterns:
      - pattern-either:
          - pattern: os.environ["$V"]
          - pattern: os.environ.get("$V", ...)
          - pattern: os.getenv("$V", ...)
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(token|secret|passw|apikey|api_key|private|aws_|npm_|github_|gh_|gcp|azure|credential|session).*

  - id: js-homedir-file-read
    languages: [javascript, typescript]
    severity: WARNING
    message: Reads files from the user's home directory
    metadata: {category: credential_access, signal: "5.3"}
    pattern-either:
      - pattern: $FS.readFileSync(<... os.homedir() ...>, ...)
      - pattern: $FS.readFile(<... os.homedir() ...>, ...)
      - pattern: $FS.readFileSync(<... process.env.HOME ...>, ...)
      - pattern: $FS.readFileSync(<... process.env.USERPROFILE ...>, ...)
      - pattern: $FS.readdirSync(<... os.homedir() ...>, ...)
